<article>
    <header class="site-hero">
        <p style="color: #718078; font-size: 14px;">{{ date format="F j, Y" }}</p>
        <h1>{{ title }}</h1>
        {{ if excerpt }}
            <p>{{ excerpt }}</p>
        {{ /if }}
        {{ if author_name }}
            <p style="font-size: 14px;">By {{ author_name }}</p>
        {{ /if }}
    </header>

    {{ if featured_image }}
        {{ featured_image }}
            <div class="site-content" style="margin-bottom: 32px;">
                <img src="{{ url }}" alt="{{ alt ?? title }}">
            </div>
        {{ /featured_image }}
    {{ /if }}

    <div class="site-content">
        {{ content }}
    </div>
</article>
