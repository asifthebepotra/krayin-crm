<article class="page">
    <header class="page-hero">
        <h1>{{ hero_heading ?? title }}</h1>
        {{ if hero_subtitle }}
            <p>{{ hero_subtitle }}</p>
        {{ /if }}
    </header>

    {{ if content }}
        <div class="page-content">
            {{ content }}
        </div>
    {{ /if }}
</article>
