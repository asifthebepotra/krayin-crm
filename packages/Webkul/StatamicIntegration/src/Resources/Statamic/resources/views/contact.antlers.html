<section style="max-width: 760px; margin: 0 auto;">
    <header style="margin-bottom: 34px;">
        <p style="margin: 0 0 12px; color: #0b8067; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;">
            Get in touch
        </p>
        <h1 style="margin: 0 0 14px; color: #102a25; font-size: clamp(38px, 6vw, 58px); letter-spacing: -.04em;">
            {{ title }}
        </h1>
        <div class="content" style="color: #53636d;">
            {{ content }}
        </div>
    </header>

    {{ form:contact }}
        {{ if success }}
            <div role="status" style="margin-bottom: 22px; padding: 16px; border: 1px solid #86c7aa; border-radius: 8px; background: #effaf4; color: #145c3a;">
                {{ success }}
            </div>
        {{ else }}
            <div style="display: grid; gap: 18px; padding: 28px; border: 1px solid #e0e6e8; border-radius: 12px; background: #fff;">
                {{ if errors }}
                    <div role="alert" style="padding: 12px; border-radius: 7px; background: #fff1f1; color: #9c2525;">
                        {{ errors }}
                            <p style="margin: 0 0 4px;">{{ value }}</p>
                        {{ /errors }}
                    </div>
                {{ /if }}

                {{ fields }}
                    <div style="display: grid; gap: 7px;">
                        <label style="color: #273943; font-size: 14px; font-weight: 650;">
                            {{ display }}
                        </label>
                        <div class="cms-form-field">
                            {{ field }}
                        </div>
                        {{ if error }}
                            <span style="color: #b42318; font-size: 12px;">{{ error }}</span>
                        {{ /if }}
                    </div>
                {{ /fields }}

                <input type="text" class="hidden" name="{{ honeypot ?? 'honeypot' }}" tabindex="-1" autocomplete="off">

                <button type="submit" style="display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 0 20px; border: 0; border-radius: 7px; background: #075a47; color: #fff; font-size: 14px; font-weight: 650; cursor: pointer;">
                    Send enquiry
                </button>
            </div>
        {{ /if }}
    {{ /form:contact }}
</section>
