<article style="max-width: 820px; margin: 0 auto;">
    <header style="margin-bottom: 34px;">
        <time datetime="{{ date format='Y-m-d' }}" style="color: #71808a; font-size: 13px;">
            {{ date format="F j, Y" }}
        </time>
        <h1 style="margin: 12px 0 0; color: #102a25; font-size: clamp(36px, 6vw, 56px); letter-spacing: -.04em; line-height: 1.12;">
            {{ title }}
        </h1>
        {{ if excerpt }}
            <p style="margin: 20px 0 0; color: #53636d; font-size: 19px; line-height: 1.65;">
                {{ excerpt }}
            </p>
        {{ /if }}
        {{ if featured_image }}
            <div style="margin-top: 28px; overflow: hidden; border-radius: 12px;">
                {{ featured_image }}
                    <img src="{{ url }}" alt="{{ alt ?? title }}" style="display: block; width: 100%; height: auto;">
                {{ /featured_image }}
            </div>
        {{ /if }}
    </header>

    <div class="content" style="color: #35434c;">
        {{ content }}
    </div>

    <p style="margin-top: 48px;">
        <a href="/blog" style="color: #075a47; font-weight: 650; text-decoration: none;">← Back to all articles</a>
    </p>
</article>
