<section style="max-width: 820px; margin: 0 auto 48px;">
    <p style="margin: 0 0 14px; color: #0b8067; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;">
        Welcome
    </p>

    <h1 style="max-width: 760px; margin: 0 0 22px; color: #102a25; font-size: clamp(42px, 7vw, 68px); font-weight: 750; letter-spacing: -.045em; line-height: 1.05;">
        {{ hero_heading ?? title }}
    </h1>

    {{ if hero_text }}
        <p style="max-width: 660px; margin: 0; color: #53636d; font-size: 20px; line-height: 1.65;">
            {{ hero_text }}
        </p>
    {{ /if }}

    {{ if hero_image }}
        <div style="margin-top: 34px; overflow: hidden; border-radius: 14px;">
            {{ hero_image }}
                <img src="{{ url }}" alt="{{ alt ?? title }}" style="display: block; width: 100%; height: auto;">
            {{ /hero_image }}
        </div>
    {{ /if }}
</section>

<section class="content" style="max-width: 820px; margin: 0 auto; color: #35434c;">
    {{ content }}
</section>

<section style="max-width: 820px; margin: 56px auto 0;">
    <a href="/blog" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 7px; background: #075a47; color: #fff; font-size: 14px; font-weight: 650; text-decoration: none;">
        Read the blog
    </a>
</section>
