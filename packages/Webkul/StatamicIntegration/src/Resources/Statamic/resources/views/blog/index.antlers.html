<section style="max-width: 900px; margin: 0 auto;">
    <header style="margin-bottom: 40px;">
        <p style="margin: 0 0 12px; color: #0b8067; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;">
            Articles
        </p>
        <h1 style="margin: 0 0 14px; color: #102a25; font-size: clamp(38px, 6vw, 58px); letter-spacing: -.04em;">
            {{ title }}
        </h1>
        <div class="content" style="color: #53636d;">
            {{ content }}
        </div>
    </header>

    <div style="display: grid; gap: 18px;">
        {{ collection:blog sort="date:desc" }}
            <article style="padding: 24px; border: 1px solid #e0e6e8; border-radius: 10px; background: #fff;">
                <time datetime="{{ date format='Y-m-d' }}" style="color: #71808a; font-size: 12px;">
                    {{ date format="F j, Y" }}
                </time>
                <h2 style="margin: 8px 0 10px; color: #123e34; font-size: 23px; line-height: 1.3;">
                    <a href="{{ url }}" style="text-decoration: none;">{{ title }}</a>
                </h2>
                {{ if excerpt }}
                    <p style="margin: 0; color: #53636d; line-height: 1.7;">{{ excerpt }}</p>
                {{ /if }}
            </article>
        {{ /collection:blog }}
    </div>
</section>
